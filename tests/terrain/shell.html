<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain test</title>
<style>
  html, body { margin: 0; background: #111; color: #ccc; font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 800px; margin: 0 auto; padding: 12px 16px; }
  canvas { display: block; width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; background: #000; }
  p { margin: 6px 0; }
  kbd { background: #333; border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<main>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<p id="status">Loading textures...</p>
<p>Courses: <span id="courses"></span></p>
<p><kbd>1</kbd>-<kbd>9</kbd> course, arrows scroll, <kbd>R</kbd> rotate, <kbd>Z</kbd> zoom,
<kbd>B</kbd> bunker at the centre, <kbd>H</kbd>/<kbd>L</kbd> raise/lower it. The mouse draws an aim line.</p>
</main>
<script>
  var Module = { canvas: document.getElementById('canvas') };
</script>

</html>
